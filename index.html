    <script>
      // Defensive guard against browser crypto wallet extensions (MetaMask, Rabby, Coinbase, etc.)
      // attempting to redefine window.ethereum and throwing 'Cannot redefine property: ethereum'
      (function() {
        try {
          const originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if ((target === window || target === globalThis) && prop === 'ethereum') {
              try {
                return originalDefineProperty.call(Object, target, prop, {
                  ...descriptor,
                  configurable: true,
                  writable: true,
                });
              } catch (e) {
                // Silently return target if duplicate non-configurable definition is attempted
                return target;
              }
            }
            return originalDefineProperty.call(Object, target, prop, descriptor);
          };

          window.addEventListener('error', function(event) {
            if (event && event.message && typeof event.message === 'string' && event.message.includes('ethereum')) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);
        } catch (err) {
          // noop
        }
      })();
    </script>
